version: "3.8"

networks:
  np-net:
    name: ml4ds2_net
    external: true

services:
  np-solr-api:
    build: ./np-solr-api
    container_name: np-solr-api
    ports:
      - 92:82
    environment:
      SOLR_URL: http://solr:8983
      NP_TOOLS_URL: http://np-tools:102
    depends_on:
      - solr
      - np-tools
    networks:
      - np-net
    volumes:
      - ./data/source:/data/source
      - ./np-config:/config
    deploy:
      resources:
        limits:
          memory: 100GB
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama:
    image: ollama/ollama:latest
    container_name: np-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      - ollama:/root/.ollama       
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 30
    networks:
      - np-net
    
  ollama-init:
    image: ollama/ollama:latest
    container_name: np-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-lc",
      "set -e; \
       echo 'Pulling embeddings mxbai-embed-large...'; \
       ollama pull mxbai-embed-large; \
       echo 'Pulling LLM llama3.1:latest...'; \
       ollama pull llama3.1:latest; \
       echo 'All models pulled.'"
    ]
    networks:
      - np-net
    restart: "no"

  np-tools:
    build: ./np-tools
    container_name: np-tools
    ports:
      - 112:102
    env_file:
      - ./np-tools/.env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    networks:
      - np-net
    volumes:
      - ./data/source:/data/source
      - ./np-config:/config
    deploy:
      resources:
        limits:
          memory: 100GB
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  solr-initializer:
    image: alpine
    container_name: np-solr-initializer
    restart: "no"
    entrypoint: |
      /bin/sh -c "chown 8983:8983 /solr"
    networks:
      - np-net
    volumes:
      - ./db/data/solr:/solr

  solr:
    image: solr:9.1.1
    container_name: np-solr
    restart: always
    volumes:
      - ./db/data/solr:/var/solr
      - ./solr-plugins/NP-solr-dist-plugin/NP-solr-dist-plugin.jar:/opt/solr/dist/plugins/NP-solr-dist-plugin.jar
      - ./solr-config:/opt/solr/server/solr
      - ./solr-config/solr.in.sh:/etc/default/solr.in.sh
    ports:
      - 8984:8983
    entrypoint:
      - docker-entrypoint.sh
      - solr
      - start
      - -f
      - -c
      - -z
      - zoo:2181
      - -a
      - "-Xdebug -Xrunjdwp:transport=dt_socket,server=y,suspend=n,address=1044 -Djute.maxbuffer=0x5000000"
    environment:
      - SOLR_OPTS=-Dsolr.jetty.request.header.size=65535
      - SOLR_JAVA_MEM=-Xms1g -Xmx1g
    networks:
      - np-net
    deploy:
      resources:
        limits:
          memory: 100GB

  zoo:
    image: zookeeper
    container_name: np-zoo
    restart: always
    ports:
      - 3180:8080
      - 3181:2181
    environment:
      - JVMFLAGS=-Djute.maxbuffer=50000000
    volumes:
      - ./db/data/zoo/data:/data
      - ./db/data/zoo/logs:/datalog
    networks:
      - np-net
    deploy:
      resources:
        limits:
          memory: 100GB

  solr-config:
    build: ./solr-config
    container_name: np-solr-config
    ports:
      - 81:81
    depends_on:
      - solr
      - zoo
    networks:
      - np-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./solr-config/bash_scripts:/bash_scripts
      - ./db/data/solr:/db/data/solr
    command:
      - sh
      - -c
      - "chmod +x /bash_scripts/init_config.sh && ls /bash_scripts && bash_scripts/init_config.sh /db/data/solr/data"
    deploy:
      resources:
        limits:
          memory: 100GB

volumes:
  ollama:
